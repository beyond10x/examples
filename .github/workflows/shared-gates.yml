name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@95d64e3cd7125d0c6e58317167df96968ad6a98c
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
